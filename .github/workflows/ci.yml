name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scaffold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database: created for this job, gone with it. Both URLs
      # point at it because there is no pooler in front.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scaffold_test
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/scaffold_test
      # Not a secret. It signs sessions in a database that only exists for
      # the next few minutes; @repo/env just needs 32 characters to boot.
      BETTER_AUTH_SECRET: ci-only-signing-key-never-used-outside-this-job
      BETTER_AUTH_URL: http://localhost:3000
      # Placeholders, not credentials. @repo/env validates at import and
      # next.config.ts imports it, so the build cannot even load its config
      # without every required variable. Real values live in Vercel.
      CRON_SECRET: ci-placeholder-cron-secret-not-real

    steps:
      - uses: actions/checkout@v4
        with:
          # The architecture test compares migrations with origin/main (an applied
          # migration must never change), which needs the history to be there.
          fetch-depth: 0

      # Reads the version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # A lockfile that drifts in CI is an unreviewed dependency change.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint and format together; `ci` never writes.
      - name: Biome
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm turbo run typecheck

      # Migrations run against a throwaway Postgres before merge.
      - name: Migrate
        run: pnpm db:migrate

      # Database tests run inside a transaction each and roll back, so they
      # share this one database without sharing state. See packages/db/src/testing.
      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  # Its own job so a new advisory turns CI red without stopping typecheck,
  # migrate, test and build from running: an advisory is not a reason to
  # hide whether the code itself is sound.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Two thresholds. Everything, dev tooling included, fails only on high
      # and critical: a moderate advisory in a test runner is Renovate's job,
      # not a red build. What ships to production is held to moderate.
      - name: Audit (all dependencies, high+)
        run: pnpm audit --audit-level=high

      # `--prod` follows peer edges too: better-auth lists vitest and
      # drizzle-kit as optional peers, so their dev-only advisories show up
      # here. Those are listed in `auditConfig.ignoreGhsas` in
      # pnpm-workspace.yaml, each with the reason; nothing else is ignored.
      - name: Audit (production dependencies, moderate+)
        run: pnpm audit --prod --audit-level=moderate

  # Runs the one-shot setup script against a clean checkout, both ways, then
  # holds the result to the same bar as the scaffold itself. It guards the
  # script against drift: an edit to a file the script rewrites fails here
  # instead of in somebody's first five minutes. Every step skips itself once
  # the script has been run and deleted, which is the state of every derived
  # project. (A job-level `if` cannot see the checkout, hence the gate step.)
  setup-script:
    name: Setup script (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        example: [declined, kept]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test database is named after the slug the script is given
      # (ci-check_test) and created by the test run itself.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/postgres
      BETTER_AUTH_SECRET: ci-only-signing-key-never-used-outside-this-job
      BETTER_AUTH_URL: http://localhost:3000
      CRON_SECRET: ci-placeholder-cron-secret-not-real

    steps:
      - uses: actions/checkout@v4

      - name: Is there a setup script to verify?
        id: gate
        run: |
          if [ -e scripts/setup.mjs ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      # A clone nobody has run `pnpm install` in must be refused before anything is
      # written: a half-modified tree is worse than an error. Two cases: no
      # node_modules at all, and a node_modules without drizzle-kit in it.
      - name: Refuses to run before pnpm install, and touches nothing
        if: steps.gate.outputs.run == 'true'
        run: |
          refused() {
            if pnpm run project:init -- --name "CI Check" --slug ci-check --no-example > out.log 2>&1; then
              cat out.log; echo "project:init succeeded without installed packages"; exit 1
            fi
            cat out.log
            grep -q "pnpm install" out.log || { echo "message does not tell the user to run pnpm install"; exit 1; }
            rm out.log
            # Nothing tracked changed, nothing untracked or ignored appeared (.env is ignored).
            test -z "$(git status --porcelain --ignored | grep -v '^!! node_modules/$')" || { git status --porcelain --ignored; exit 1; }
          }
          test ! -e node_modules
          refused
          mkdir node_modules
          refused
          rmdir node_modules

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run setup
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ matrix.example }}" = "kept" ]; then flag=--keep-example; else flag=--no-example; fi
          pnpm run project:init -- --name "CI Check" --slug ci-check "$flag"

      - name: Setup removed itself and wrote a blank .env
        if: steps.gate.outputs.run == 'true'
        run: |
          test ! -e scripts/setup.mjs
          if grep -q '"project:init"' package.json; then echo "package.json still has the project:init script"; exit 1; fi
          test -f .env
          if grep -E '^[A-Z][A-Z0-9_]*=.+' .env; then echo ".env carries a value"; exit 1; fi

      - name: Running setup again changes nothing
        if: steps.gate.outputs.run == 'true'
        run: |
          git status --porcelain > /tmp/before.status
          git diff | sha256sum > /tmp/before.diff
          if pnpm run project:init -- --name "CI Check" --slug ci-check --no-example; then
            echo "the setup script is still runnable"; exit 1
          fi
          git status --porcelain > /tmp/after.status
          git diff | sha256sum > /tmp/after.diff
          diff /tmp/before.status /tmp/after.status
          diff /tmp/before.diff /tmp/after.diff

      - name: Biome
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec biome ci .

      - name: Migrate
        if: steps.gate.outputs.run == 'true'
        run: pnpm db:migrate

      - name: Check
        if: steps.gate.outputs.run == 'true'
        run: pnpm check
